spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

telegram.webhook.auto-register=${TELEGRAM_WEBHOOK_AUTO_REGISTER:false}
telegram.webhook.require-secret=${TELEGRAM_WEBHOOK_REQUIRE_SECRET:false}
telegram.webhook.manual-management-enabled=${TELEGRAM_WEBHOOK_MANUAL_MANAGEMENT_ENABLED:true}
