spring.application.name=whatsapp-saldo

server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

telegram.bot.api-url=${TELEGRAM_API_URL:https://api.telegram.org}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.webhook.url=${TELEGRAM_WEBHOOK_PUBLIC_URL:}
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.webhook.auto-register=${TELEGRAM_WEBHOOK_AUTO_REGISTER:false}
telegram.webhook.require-secret=${TELEGRAM_WEBHOOK_REQUIRE_SECRET:false}
telegram.webhook.manual-management-enabled=${TELEGRAM_WEBHOOK_MANUAL_MANAGEMENT_ENABLED:true}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
