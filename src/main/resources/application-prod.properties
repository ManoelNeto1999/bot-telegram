spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.webhook.url=${TELEGRAM_WEBHOOK_PUBLIC_URL}
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET}
telegram.webhook.auto-register=${TELEGRAM_WEBHOOK_AUTO_REGISTER:true}
telegram.webhook.require-secret=true
telegram.webhook.manual-management-enabled=${TELEGRAM_WEBHOOK_MANUAL_MANAGEMENT_ENABLED:false}

management.endpoint.health.probes.enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
